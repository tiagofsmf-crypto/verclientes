<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaia Phone</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f4f7;
}

/* LOGIN */
.login-wrap{
max-width:420px;
margin:80px auto;
background:#fff;
padding:25px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.login-wrap input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

.login-wrap button{
width:100%;
padding:12px;
background:#0d2340;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

/* APP */
.app{display:none}
.container{max-width:1000px;margin:auto;padding:20px}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#0d2340;
color:#fff;
cursor:pointer;
}

.small{font-size:12px;color:#666}

/* FICHA */
.print{
display:none;
max-width:700px;
margin:20px auto;
padding:20px;
background:#fff;
text-align:center;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* 🔥 FIX VISUAL (RESOLVE TEXTO INVISÍVEL) */
#printArea p{
color:#000 !important;
font-size:16px;
margin:6px 0;
}

#printArea span{
color:#000 !important;
font-weight:500;
}

/* IMPRESSÃO DEFINITIVA */
@media print {

body *{
visibility:hidden !important;
}

#printArea{
display:block !important;
visibility:visible !important;
position:absolute;
left:0;
top:0;
width:100%;
padding:20px;
}

#printArea *{
visibility:visible !important;
color:#000 !important;
}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">

<img src="logo.png" style="width:120px;margin-bottom:10px">

<h2>Gaia Phone</h2>

<input id="email" type="text" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="tryLogin()">Entrar</button>

<p onclick="recoverPassword()" style="cursor:pointer;color:#0d2340;margin-top:10px">
📧 Recuperar palavra-passe
</p>

</div>

<!-- APP -->
<div class="container app" id="app">

<div class="grid">

<!-- CLIENTE -->
<div class="card">
<h3>Adicionar Cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="addCliente()">Adicionar</button>
</div>

<!-- LISTA -->
<div class="card">
<h3>Clientes</h3>

<select id="lista" size="10"></select>

<div style="display:flex;gap:10px;margin-top:10px">
<button onclick="abrirFicha()" style="flex:1">Abrir Ficha</button>
<button onclick="printFicha()" style="flex:1">Imprimir</button>
<button onclick="deleteCliente()" style="flex:1;background:#b30000">Eliminar</button>
</div>

<div style="margin-top:10px">
<label><input type="radio" name="status" value="Reparado"> Reparado</label>
<label><input type="radio" name="status" value="Sem reparação"> Sem reparação</label>
</div>

</div>

</div>
</div>

<!-- FICHA -->
<div class="print" id="printArea">

<img src="logo.png" style="width:100px;margin-bottom:10px">

<h2>Gaia Phone - Ficha de Cliente</h2>

<p><b>Nome:</b> <span id="pNome"></span></p>
<p><b>Telefone:</b> <span id="pTelefone"></span></p>
<p><b>IMEI:</b> <span id="pIMEI"></span></p>
<p><b>Marca:</b> <span id="pMarca"></span></p>
<p><b>Modelo:</b> <span id="pModelo"></span></p>
<p><b>Avaria:</b> <span id="pAvaria"></span></p>
<p><b>Status:</b> <span id="pStatus"></span></p>

<hr>

<div class="small">
Rua José Rocha, 189 A — V.N. Gaia<br>
222 441 808 • 931 965 105 • gaiaphone@gmail.com
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyD9emhCy-3-xZIvlq8B3zHNg_JjIckfyCk",
authDomain: "gaiaphone-4a260.firebaseapp.com",
projectId: "gaiaphone-4a260",
storageBucket: "gaiaphone-4a260.firebasestorage.app",
messagingSenderId: "867023294236",
appId: "1:867023294236:web:e0b08ffdfa19aa4c2cb4d9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.tryLogin = function(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("loginWrap").style.display="none";
document.getElementById("app").style.display="block";
loadClientes();
})
.catch(()=>alert("Login errado"));
};

window.recoverPassword = function(){
const email = document.getElementById("email").value;

if(!email){
alert("Escreve o email primeiro");
return;
}

sendPasswordResetEmail(auth,email)
.then(()=>alert("Email enviado"))
.catch(()=>alert("Erro"));
};
</script>

<!-- SISTEMA -->
<script>

let clientes=[];

/* ENTER LOGIN */
document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
if(document.getElementById("loginWrap").style.display!=="none"){
tryLogin();
}
}
});

/* SAVE */
function save(){
localStorage.setItem("clientes",JSON.stringify(clientes));
}

/* LOAD */
function loadClientes(){
clientes=JSON.parse(localStorage.getItem("clientes")||"[]");
render();
}

/* RENDER */
function render(){
const lista=document.getElementById("lista");
lista.innerHTML="";

clientes.forEach((c,i)=>{
let opt=document.createElement("option");
opt.value=i;
opt.text=c.nome+" - "+c.telefone;
lista.add(opt);
});
}

/* ADD */
function addCliente(){

const nome=document.getElementById("nome").value.trim();
const telefone=document.getElementById("telefone").value.trim();
const imei=document.getElementById("imei").value.trim();
const marca=document.getElementById("marca").value.trim();
const modelo=document.getElementById("modelo").value.trim();
const avaria=document.getElementById("avaria").value.trim();

if(!nome){
alert("Nome obrigatório");
return;
}

clientes.push({nome,telefone,imei,marca,modelo,avaria});

save();
render();

/* limpar */
document.getElementById("nome").value="";
document.getElementById("telefone").value="";
document.getElementById("imei").value="";
document.getElementById("marca").value="";
document.getElementById("modelo").value="";
document.getElementById("avaria").value="";
}

/* FICHA FINAL CORRIGIDA */
function abrirFicha(){

const i=document.getElementById("lista").selectedIndex;
if(i===-1 || !clientes[i]){
alert("Seleciona um cliente");
return;
}

const c=clientes[i];
const st=document.querySelector('input[name="status"]:checked');

document.getElementById("pNome").textContent = c.nome || "—";
document.getElementById("pTelefone").textContent = c.telefone || "—";
document.getElementById("pIMEI").textContent = c.imei || "—";
document.getElementById("pMarca").textContent = c.marca || "—";
document.getElementById("pModelo").textContent = c.modelo || "—";
document.getElementById("pAvaria").textContent = c.avaria || "—";
document.getElementById("pStatus").textContent = st ? st.value : "—";

document.getElementById("printArea").style.display="block";

setTimeout(()=>{
document.getElementById("printArea").scrollIntoView({behavior:"smooth"});
},50);
}

/* PRINT */
function printFicha(){
window.print();
}

/* DELETE */
function deleteCliente(){

const i=document.getElementById("lista").selectedIndex;
if(i===-1)return;

if(!confirm("Eliminar cliente?"))return;

clientes.splice(i,1);
save();
render();
}

</script>

</body>
</html>
