<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gaia Phone - Gestão de Clientes</title>

<style>
:root{
--bg:#f2f4f7;
--card:#ffffff;
--navy:#0d2340;
--navy-dark:#07162a;
--muted:#666;
}
html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:#222}
.container{max-width:980px;margin:24px auto;padding:20px}

/* login */
.login-wrap{max-width:420px;margin:80px auto;background:var(--card);padding:28px;border-radius:10px;box-shadow:0 6px 20px rgba(5,20,40,0.08);text-align:center}
.login-wrap img{width:120px;margin-bottom:14px}
.login-wrap input{width:100%;padding:12px;border-radius:8px;border:1px solid #d6dbe3;margin:10px 0;font-size:15px}
.login-wrap button{width:100%;padding:12px;border-radius:8px;border:none;background:var(--navy);color:white;font-weight:600;cursor:pointer}
.login-wrap button:hover{background:var(--navy-dark)}

/* app */
.app{display:none}
.header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.header img{width:64px}
.header h1{margin:0;font-size:20px;color:var(--navy)}

.grid{display:grid;grid-template-columns:1fr 360px;gap:20px}
.card{background:var(--card);padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(5,20,40,0.06)}
.card h2{margin:0 0 12px 0;font-size:16px;color:var(--navy)}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #d6dbe3;font-size:14px}
.row{display:flex;gap:8px}
button{padding:10px 12px;border-radius:8px;border:none;background:var(--navy);color:#fff;cursor:pointer;font-weight:600}

.small{font-size:13px;color:var(--muted)}

@media(max-width:900px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
<img src="logo.png" alt="Logo">
<h2>Gaia Phone — Acesso</h2>
<p class="small">Introduza o email para entrar</p>

<input id="pw" type="text" placeholder="Email da loja" />
<button onclick="tryLogin()">Entrar</button>

<p class="small" onclick="recoverPassword()" style="cursor:pointer;color:#0d2340;margin-top:10px">
📧 Recuperar palavra-passe
</p>

</div>

<!-- APP -->
<div class="container app" id="app">

<div class="header">
<img src="logo.png">
<div>
<h1>Gaia Phone — Gestão de Clientes</h1>
<div class="small">Sistema interno da loja</div>
</div>
</div>

<div class="grid">

<div class="card">
<h2>Adicionar Cliente</h2>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="addCliente()" style="margin-top:10px">Adicionar</button>
</div>

<div class="card">
<h2>Clientes</h2>
<select id="clienteSelect" size="8"></select>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyD9emhCy-3-xZIvlq8B3zHNg_JjIckfyCk",
authDomain: "gaiaphone-4a260.firebaseapp.com",
projectId: "gaiaphone-4a260",
storageBucket: "gaiaphone-4a260.firebasestorage.app",
messagingSenderId: "867023294236",
appId: "1:867023294236:web:e0b08ffdfa19aa4c2cb4d9",
measurementId: "G-RGP6KMC6WT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */
window.tryLogin = function(){
const email = document.getElementById("pw").value;

signInWithEmailAndPassword(auth, email, "123456")
.then(() => {
document.getElementById("loginWrap").style.display = "none";
document.getElementById("app").style.display = "block";
})
.catch(() => alert("Login errado"));
};

/* RECUPERAÇÃO */
window.recoverPassword = function(){
const email = document.getElementById("pw").value;

sendPasswordResetEmail(auth, email)
.then(() => alert("Email enviado para recuperação"))
.catch(() => alert("Erro ao enviar email"));
};

/* CLIENTES (igual ao teu sistema simples) */
let clientes = [];

window.addCliente = function(){
const c = {
nome: nome.value,
telefone: telefone.value,
imei: imei.value,
marca: marca.value,
modelo: modelo.value,
avaria: avaria.value
};

clientes.push(c);
localStorage.setItem("clientes", JSON.stringify(clientes));

const sel = document.getElementById("clienteSelect");
const opt = document.createElement("option");
opt.text = c.nome + " - " + c.telefone;
sel.add(opt);
};

</script>

</body>
</html>
