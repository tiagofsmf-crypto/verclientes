<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gaia Phone PRO</title>

<style>
body{margin:0;font-family:Arial;background:#f2f4f7}

.login{
max-width:400px;margin:80px auto;background:#fff;padding:25px;
border-radius:10px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,0.1)
}

input,button,select{
width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc
}

button{background:#0d2340;color:#fff;border:none;cursor:pointer}

.app{display:none}
.container{max-width:1000px;margin:auto;padding:20px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.card{background:#fff;padding:15px;border-radius:10px}

.small{font-size:12px;color:#666}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
<h2>Gaia Phone PRO</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Entrar</button>

<p onclick="recover()" style="cursor:pointer;color:#0d2340">
📧 Recuperar password
</p>
</div>

<!-- APP -->
<div class="container app" id="app">

<h2>Gestão de Clientes PRO</h2>

<div class="grid">

<div class="card">
<h3>Adicionar Cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="addCliente()">Adicionar</button>
</div>

<div class="card">
<h3>Clientes</h3>

<select id="lista" size="10"></select>

<button onclick="abrirFicha()">Abrir Ficha</button>
<button onclick="imprimir()">Imprimir</button>

<div style="margin-top:10px">
<label><input type="radio" name="status" value="Reparado"> Reparado</label>
<label><input type="radio" name="status" value="Sem reparação"> Sem reparação</label>
</div>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyD9emhCy-3-xZIvlq8B3zHNg_JjIckfyCk",
authDomain: "gaiaphone-4a260.firebaseapp.com",
projectId: "gaiaphone-4a260",
storageBucket: "gaiaphone-4a260.firebasestorage.app",
messagingSenderId: "867023294236",
appId: "1:867023294236:web:e0b08ffdfa19aa4c2cb4d9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let clientes = [];

/* LOGIN */
window.login = function(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";
loadClientes();
})
.catch(()=>alert("Erro login"));
};

/* RECOVER */
window.recover = function(){
const email = document.getElementById("email").value;

sendPasswordResetEmail(auth,email)
.then(()=>alert("Email enviado"))
.catch(()=>alert("Erro"));
};

/* ADD CLIENTE (CLOUD) */
window.addCliente = async function(){

const c = {
nome:nome.value,
telefone:telefone.value,
imei:imei.value,
marca:marca.value,
modelo:modelo.value,
avaria:avaria.value
};

await addDoc(collection(db,"clientes"),c);

loadClientes();
};

/* LOAD CLIENTES */
window.loadClientes = async function(){

const snap = await getDocs(collection(db,"clientes"));

clientes = [];

snap.forEach(doc=>{
clientes.push(doc.data());
});

render();
};

function render(){
const sel = document.getElementById("lista");
sel.innerHTML="";

clientes.forEach((c,i)=>{
let opt=document.createElement("option");
opt.text = c.nome+" - "+c.telefone;
opt.value=i;
sel.add(opt);
});
}

/* FICHA */
window.abrirFicha = function(){

const i = lista.value;
const c = clientes[i];

const status = document.querySelector('input[name="status"]:checked');

alert(
`Nome: ${c.nome}
Telefone: ${c.telefone}
IMEI: ${c.imei}
Marca: ${c.marca}
Modelo: ${c.modelo}
Avaria: ${c.avaria}
Status: ${status?status.value:"-"}`
);
};

/* PRINT */
window.imprimir = function(){
window.print();
};

</script>

</body>
</html>
