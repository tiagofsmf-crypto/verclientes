<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gaia Phone - Gestão de Clientes</title>

<style>
:root{
--bg:#f2f4f7;
--card:#ffffff;
--navy:#0d2340;
--navy-dark:#07162a;
--muted:#666;
}

html,body{
height:100%;
margin:0;
font-family:Arial;
background:var(--bg);
color:#222;
}

/* LOGIN (mantido bonito como antes) */
.login-wrap{
max-width:420px;
margin:80px auto;
background:#fff;
padding:28px;
border-radius:10px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

.login-wrap input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

.login-wrap button{
width:100%;
padding:12px;
background:#0d2340;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

.app{display:none}

/* resto do teu sistema NÃO ALTERADO */
.container{max-width:980px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;padding:15px;border-radius:10px}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#0d2340;
color:#fff;
cursor:pointer;
}

.small{font-size:12px;color:#666}

</style>
</head>

<body>

<!-- LOGIN (SÓ ALTERADO AQUI) -->
<div class="login-wrap" id="loginWrap">

<img src="logo.png" style="width:120px;margin-bottom:10px">

<h2>Gaia Phone</h2>

<input id="email" type="text" placeholder="Email da loja">
<input id="password" type="password" placeholder="Password">

<button onclick="tryLogin()">Entrar</button>

<p class="small" onclick="recoverPassword()" style="cursor:pointer;color:#0d2340;margin-top:10px">
📧 Recuperar palavra-passe
</p>

</div>

<!-- APP (TUDO IGUAL AO TEU ORIGINAL) -->
<div class="container app" id="app">

<div class="grid">

<div class="card">
<h3>Adicionar Cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="add()">Adicionar</button>
</div>

<div class="card">
<h3>Lista de Clientes</h3>

<select id="lista" size="10"></select>

<button onclick="abrir()">Abrir Ficha</button>
<button onclick="printFicha()">Imprimir</button>

<div style="margin-top:10px">
<label><input type="radio" name="status" value="Reparado"> Reparado</label>
<label><input type="radio" name="status" value="Sem reparação"> Sem reparação</label>
</div>

</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyD9emhCy-3-xZIvlq8B3zHNg_JjIckfyCk",
authDomain: "gaiaphone-4a260.firebaseapp.com",
projectId: "gaiaphone-4a260",
storageBucket: "gaiaphone-4a260.firebasestorage.app",
messagingSenderId: "867023294236",
appId: "1:867023294236:web:e0b08ffdfa19aa4c2cb4d9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */
window.tryLogin = function(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
document.getElementById("loginWrap").style.display="none";
document.getElementById("app").style.display="block";
})
.catch(()=>{
alert("Login errado");
});

};

/* RECUPERAR PASSWORD REAL */
window.recoverPassword = function(){

const email = document.getElementById("email").value;

if(!email){
alert("Escreve o email primeiro");
return;
}

sendPasswordResetEmail(auth,email)
.then(()=>{
alert("Email de recuperação enviado!");
})
.catch(()=>{
alert("Erro ao enviar email");
});

};

/* ===== TEU SISTEMA ORIGINAL (NÃO MEXIDO) ===== */

let clientes=[];

function save(){
localStorage.setItem("clientes",JSON.stringify(clientes));
}

function load(){
clientes=JSON.parse(localStorage.getItem("clientes")||"[]");
render();
}

function render(){
lista.innerHTML="";

clientes.forEach((c,i)=>{
let o=document.createElement("option");
o.value=i;
o.text=c.nome+" - "+c.telefone;
lista.add(o);
});
}

function add(){

const c={
nome:nome.value,
telefone:telefone.value,
imei:imei.value,
marca:marca.value,
modelo:modelo.value,
avaria:avaria.value
};

clientes.push(c);
save();
render();
}

function abrir(){

const i=lista.value;
if(i==="")return;

const c=clientes[i];
const st=document.querySelector('input[name="status"]:checked');

alert(
`Nome: ${c.nome}
Telefone: ${c.telefone}
IMEI: ${c.imei}
Marca: ${c.marca}
Modelo: ${c.modelo}
Avaria: ${c.avaria}
Status: ${st?st.value:"-"}`
);
}

function printFicha(){
window.print();
}

</script>

</body>
</html>
