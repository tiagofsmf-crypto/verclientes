<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaia Phone</title>

<style>
body{margin:0;font-family:Arial;background:#f2f4f7}

.login{
max-width:400px;margin:80px auto;background:#fff;padding:25px;
border-radius:10px;text-align:center;
}

input,button,select{
width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;
}

button{background:#0d2340;color:#fff;border:none;cursor:pointer}

.app{display:none}
.container{max-width:1000px;margin:auto;padding:20px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.card{background:#fff;padding:15px;border-radius:10px}

.print{
display:none;
max-width:700px;
margin:auto;
padding:20px;
background:#fff;
text-align:center;
}

@media print{
body *{visibility:hidden}
.print, .print *{visibility:visible}
.print{position:absolute;top:0;left:0;width:100%}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
<h2>Gaia Phone</h2>
<input id="pw" type="password" placeholder="Password">
<button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div class="container app" id="app">

<div class="grid">

<div class="card">
<h3>Cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="add()">Adicionar</button>
</div>

<div class="card">
<h3>Lista</h3>

<select id="lista" size="10"></select>

<button onclick="abrir()">Abrir Ficha</button>
<button onclick="printFicha()">Imprimir</button>

<div>
<label><input type="radio" name="status" value="Reparado"> Reparado</label>
<label><input type="radio" name="status" value="Sem reparação"> Sem reparação</label>
</div>

</div>

</div>
</div>

<!-- FICHA IMPRESSÃO -->
<div class="print" id="printArea">
<h2>Reparações Gaia Phone</h2>

<p><b>Nome:</b> <span id="pNome"></span></p>
<p><b>Telefone:</b> <span id="pTel"></span></p>
<p><b>IMEI:</b> <span id="pImei"></span></p>
<p><b>Marca:</b> <span id="pMarca"></span></p>
<p><b>Modelo:</b> <span id="pModelo"></span></p>
<p><b>Avaria:</b> <span id="pAvaria"></span></p>
<p><b>Status:</b> <span id="pStatus"></span></p>
</div>

<script>

const PASS = "12345";
let clientes = [];

function login(){
if(pw.value === PASS){
loginBox.style.display="none";
app.style.display="block";
load();
}
else alert("Errado");
}

/* GUARDAR */
function save(){
localStorage.setItem("clientes",JSON.stringify(clientes));
}

/* CARREGAR */
function load(){
clientes = JSON.parse(localStorage.getItem("clientes")||"[]");
render();
}

/* RENDER RÁPIDO */
function render(){
lista.innerHTML="";
clientes.forEach((c,i)=>{
let o=document.createElement("option");
o.value=i;
o.text=c.nome+" - "+c.telefone;
lista.add(o);
});
}

/* ADD CLIENTE */
function add(){

const c={
nome:nome.value,
telefone:telefone.value,
imei:imei.value,
marca:marca.value,
modelo:modelo.value,
avaria:avaria.value
};

clientes.push(c);
save();
render();
}

/* ABRIR FICHA BONITA */
function abrir(){

const i=lista.value;
if(i==="") return;

const c=clientes[i];
const status=document.querySelector('input[name="status"]:checked');

pNome.innerText=c.nome;
pTel.innerText=c.telefone;
pImei.innerText=c.imei;
pMarca.innerText=c.marca;
pModelo.innerText=c.modelo;
pAvaria.innerText=c.avaria;
pStatus.innerText=status?status.value:"-";

printArea.style.display="block";
}

/* PRINT */
function printFicha(){
window.print();
}

</script>

</body>
</html>
