<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gaia Phone - Gestão de Clientes</title>

<style>
:root{
--bg:#f2f4f7;
--card:#ffffff;
--navy:#0d2340;
--navy-dark:#07162a;
--muted:#666;
}
html,body{height:100%;margin:0;font-family:Arial;background:var(--bg);color:#222}

.login-wrap{
max-width:420px;margin:80px auto;background:#fff;padding:28px;
border-radius:10px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.1);
}
.login-wrap input{
width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;
}
.login-wrap button{
width:100%;padding:12px;border:none;background:var(--navy);color:#fff;
border-radius:8px;cursor:pointer;
}

.app{display:none}
.container{max-width:980px;margin:auto;padding:20px}

.header{display:flex;gap:10px;align-items:center}
.header img{width:60px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

.card{background:#fff;padding:15px;border-radius:10px}

input,select{
width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;
}

button{padding:10px;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}

.small{font-size:12px;color:#666}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
<h2>Gaia Phone</h2>

<input id="pw" placeholder="Email da loja">

<button onclick="tryLogin()">Entrar</button>

<p class="small" onclick="recoverPassword()" style="cursor:pointer;color:#0d2340">
📧 Recuperar palavra-passe
</p>
</div>

<!-- APP -->
<div class="container app" id="app">

<div class="header">
<img src="logo.png">
<h2>Gestão de Clientes</h2>
</div>

<div class="grid">

<div class="card">
<h3>Adicionar Cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="imei" placeholder="IMEI">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="avaria" placeholder="Avaria">

<button onclick="addCliente()">Adicionar</button>
</div>

<div class="card">
<h3>Clientes</h3>

<select id="clienteSelect" size="10"></select>

<div style="margin-top:10px">
<button onclick="abrirFicha()">Abrir Ficha</button>
<button onclick="imprimirFicha()">Imprimir</button>
</div>

<div style="margin-top:10px">
<label><input type="radio" name="status" value="Reparado"> Reparado</label>
<label><input type="radio" name="status" value="Sem reparação"> Sem reparação</label>
</div>

</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyD9emhCy-3-xZIvlq8B3zHNg_JjIckfyCk",
authDomain: "gaiaphone-4a260.firebaseapp.com",
projectId: "gaiaphone-4a260",
storageBucket: "gaiaphone-4a260.firebasestorage.app",
messagingSenderId: "867023294236",
appId: "1:867023294236:web:e0b08ffdfa19aa4c2cb4d9"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);

/* LOGIN */
window.tryLogin = function () {
const email = document.getElementById("pw").value;
const password = "123456";

signInWithEmailAndPassword(auth, email, password)
.then(() => {
document.getElementById("loginWrap").style.display = "none";
document.getElementById("app").style.display = "block";
loadClientes();
})
.catch(() => alert("Login errado"));
};

/* RECUPERAÇÃO */
window.recoverPassword = function () {
const email = document.getElementById("pw").value;

sendPasswordResetEmail(auth, email)
.then(() => alert("Email enviado"))
.catch(() => alert("Erro ao enviar"));
};

/* CLIENTES */
let clientes = [];

function save(){
localStorage.setItem("clientes", JSON.stringify(clientes));
}

function loadClientes(){
clientes = JSON.parse(localStorage.getItem("clientes") || "[]");
render();
}

function render(){
const sel = document.getElementById("clienteSelect");
sel.innerHTML = "";
clientes.forEach((c,i)=>{
let opt = document.createElement("option");
opt.value = i;
opt.text = c.nome + " - " + c.telefone;
sel.add(opt);
});
}

window.addCliente = function(){
const c = {
nome:nome.value,
telefone:telefone.value,
imei:imei.value,
marca:marca.value,
modelo:modelo.value,
avaria:avaria.value
};

clientes.push(c);
save();
render();
};

/* FICHA */
window.abrirFicha = function(){
const i = document.getElementById("clienteSelect").value;
if(i==="") return alert("Seleciona cliente");

const c = clientes[i];

alert(
`Nome: ${c.nome}
Telefone: ${c.telefone}
IMEI: ${c.imei}
Marca: ${c.marca}
Modelo: ${c.modelo}
Avaria: ${c.avaria}`
);
};

/* PRINT */
window.imprimirFicha = function(){
window.print();
};

</script>

</body>
</html>
